<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Questions - IRL Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8f9fa;
            color: #1a1a1a;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .progress-bar {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-text {
            font-size: 0.875rem;
            color: #666;
        }

        .progress-track {
            background: #e9ecef;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            background: #1a1a1a;
            height: 100%;
            transition: width 0.3s ease;
        }

        .question-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
        }

        .dimension-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #f8f9fa;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 1rem;
        }

        .question-number {
            font-size: 0.875rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #1a1a1a;
            line-height: 1.4;
        }

        .question-help {
            font-size: 1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .answer-options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .answer-option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .answer-option:hover {
            border-color: #1a1a1a;
            background: white;
        }

        .answer-option.selected {
            border-color: #1a1a1a;
            background: #1a1a1a;
            color: white;
            font-weight: 600;
        }

        .navigation-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #1a1a1a;
            color: white;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-primary:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 26, 26, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #1a1a1a;
            border: 2px solid #1a1a1a;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid #e9ecef;
            border-top-color: #1a1a1a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .category-header {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .category-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .category-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="categoryHeader" class="category-header" style="display: none;">
            <!-- Category info will be inserted here -->
        </div>

        <div class="progress-bar">
            <div class="progress-info">
                <span class="progress-text" id="progressText">Question 1 of 25</span>
                <span class="progress-text" id="dimensionText"></span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div id="questionContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem;">Loading assessment...</p>
            </div>
        </div>
    </div>

    <script src="../engine/assessment-engine.js"></script>
    <script>
        const assessmentEngine = new AssessmentEngine();
        let currentQuestionIndex = 0;
        let questions = [];
        let selectedCategory = null;

        async function init() {
            // Get category from URL
            const params = new URLSearchParams(window.location.search);
            const categoryId = params.get('category') || localStorage.getItem('selectedCategory');

            if (!categoryId) {
                window.location.href = 'category-selection.html';
                return;
            }

            // Load data
            await assessmentEngine.loadCategories();
            questions = await assessmentEngine.loadQuestions();
            
            selectedCategory = assessmentEngine.getCategoryById(categoryId);
            if (!selectedCategory) {
                alert('Invalid category');
                window.location.href = 'category-selection.html';
                return;
            }

            // Start assessment
            assessmentEngine.startAssessment(categoryId);

            // Show category header
            displayCategoryHeader();
            
            // Show first question
            displayQuestion();
        }

        function displayCategoryHeader() {
            const header = document.getElementById('categoryHeader');
            header.style.display = 'block';
            header.innerHTML = `
                <div class="category-icon">${selectedCategory.icon}</div>
                <div class="category-name">${selectedCategory.name}</div>
            `;
        }

        function displayQuestion() {
            const question = questions[currentQuestionIndex];
            const container = document.getElementById('questionContainer');

            // Update progress
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('dimensionText').textContent = 
                `Dimension: ${question.dimension.charAt(0).toUpperCase() + question.dimension.slice(1)}`;

            // Build question UI
            const isAnswered = assessmentEngine.currentAssessment.answers[question.id] !== undefined;
            const savedAnswer = assessmentEngine.currentAssessment.answers[question.id];

            container.innerHTML = `
                <div class="question-card">
                    <div class="dimension-badge">${question.dimension}</div>
                    <div class="question-number">Question ${currentQuestionIndex + 1} of ${questions.length}</div>
                    <h2 class="question-text">${question.text}</h2>
                    <p class="question-help">${question.help}</p>
                    
                    <div class="answer-options">
                        ${question.options.map((option, index) => `
                            <div class="answer-option ${savedAnswer === option.score ? 'selected' : ''}"
                                 onclick="selectAnswer(${option.score})">
                                ${option.text}
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="navigation-buttons">
                        ${currentQuestionIndex > 0 ? 
                            '<button class="btn btn-secondary" onclick="previousQuestion()">← Previous</button>' : 
                            '<div></div>'}
                        <button class="btn btn-primary" id="nextBtn" 
                                ${!isAnswered ? 'disabled' : ''}
                                onclick="nextQuestion()">
                            ${currentQuestionIndex === questions.length - 1 ? 'Complete Assessment →' : 'Next →'}
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(score) {
            const question = questions[currentQuestionIndex];
            
            // Save answer
            assessmentEngine.saveAnswer(question.id, score);
            
            // Update UI
            document.querySelectorAll('.answer-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            event.target.classList.add('selected');
            
            // Enable next button
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                completeAssessment();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function completeAssessment() {
            // Show loading
            document.getElementById('questionContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <h2 style="margin-top: 1rem;">Calculating your IRL level...</h2>
                    <p style="color: #666; margin-top: 0.5rem;">Analyzing your responses across all dimensions</p>
                </div>
            `;

            // Calculate scores
            setTimeout(() => {
                assessmentEngine.calculateScores();
                assessmentEngine.saveAssessmentToStorage();
                
                // Redirect to results
                window.location.href = 'results.html';
            }, 2000);
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
