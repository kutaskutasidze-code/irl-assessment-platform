<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Category - IRL Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .header p {
            font-size: 1.125rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .category-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 16px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .category-card:hover {
            border-color: #1a1a1a;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .category-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .category-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .category-description {
            font-size: 0.875rem;
            color: #666;
            margin-bottom: 0.75rem;
        }

        .category-examples {
            font-size: 0.75rem;
            color: #999;
            font-style: italic;
        }

        .btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 26, 26, 0.4);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .back-button {
            margin-bottom: 2rem;
        }

        .btn-secondary {
            background: white;
            color: #1a1a1a;
            border: 2px solid #1a1a1a;
        }

        .btn-secondary:hover {
            background: #1a1a1a;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-button">
            <a href="../../index.html" class="btn btn-secondary">← Back to Dashboard</a>
        </div>

        <div class="header">
            <h1>Select Your Industry Category</h1>
            <p>Choose the category that best describes your startup. This will customize the assessment questions to your specific industry.</p>
        </div>

        <div id="categoriesContainer">
            <div class="loading">
                <p>Loading categories...</p>
            </div>
        </div>
    </div>

    <script src="../engine/assessment-engine.js"></script>
    <script>
        const assessmentEngine = new AssessmentEngine();

        async function init() {
            const categories = await assessmentEngine.loadCategories();
            renderCategories(categories);
        }

        function renderCategories(categories) {
            const container = document.getElementById('categoriesContainer');
            
            if (!categories || categories.length === 0) {
                container.innerHTML = '<div class="loading"><p>No categories available</p></div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'categories-grid';

            categories.forEach(category => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => selectCategory(category.id);
                
                card.innerHTML = `
                    <div class="category-icon">${category.icon}</div>
                    <div class="category-name">${category.name}</div>
                    <div class="category-description">${category.description}</div>
                    <div class="category-examples">e.g., ${category.examples}</div>
                `;

                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function selectCategory(categoryId) {
            // Save selected category
            localStorage.setItem('selectedCategory', categoryId);
            // Navigate to assessment questions
            window.location.href = `questions.html?category=${categoryId}`;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
